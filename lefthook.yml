pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{js,jsx,ts,tsx,mts,mjs,json,jsonc,css}'
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    # tsc はプロジェクト全体を見るのでファイル単位に絞れない
    - name: typecheck
      run: pnpm run typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
